name: CI Guardrails (standalone)

# Reusable guardrail workflow for standalone projects.
# Call it from a project with:
#
#   jobs:
#     guardrails:
#       uses: blueworx-io/bluegroup_core_foundation/.github/workflows/ci-standalone.yml@v1
#       with:
#         foundation_ref: v1
#
on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version.
        type: string
        default: '20'
      lint_command:
        description: Command to run the linter.
        type: string
        default: npm run lint
      build_command:
        description: Command to build the project.
        type: string
        default: npm run build
      test_command:
        description: >-
          Command to run Playwright tests against the local build. Keep the json
          reporter — the zero-tests check reads its output.
        type: string
        default: npx playwright test --reporter=list,json
      foundation_ref:
        description: Ref of the foundation repo to pull the shared check scripts from.
        type: string
        default: main

jobs:
  guardrails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Fetched into the runner's temp dir, deliberately NOT checked out into
      # the workspace: a project whose lint or test script walks its own tree
      # (`eslint .`, a bare test glob) would otherwise find the foundation's
      # scripts and fail the build on someone else's code style.
      - name: Fetch foundation (shared check scripts)
        env:
          FOUNDATION_REF: ${{ inputs.foundation_ref }}
        run: |
          set -euo pipefail
          # init + fetch rather than `clone --branch`, so foundation_ref can be a
          # branch, a tag, or an exact commit SHA.
          mkdir -p "$RUNNER_TEMP/foundation"
          cd "$RUNNER_TEMP/foundation"
          git init -q .
          git remote add origin https://github.com/blueworx-io/bluegroup_core_foundation.git
          git fetch -q --depth 1 origin "$FOUNDATION_REF"
          git checkout -q FETCH_HEAD

      - name: Fetch base branch
        if: github.base_ref != ''
        run: git fetch --no-tags origin "${{ github.base_ref }}" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: ${{ inputs.lint_command }}

      - name: Build
        run: ${{ inputs.build_command }}

      - name: Version bump check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node "$RUNNER_TEMP/foundation/scripts/check-version-bump.mjs"

      - name: Changelog check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node "$RUNNER_TEMP/foundation/scripts/check-changelog.mjs"

      - name: Approved dependencies check
        run: node "$RUNNER_TEMP/foundation/scripts/check-approved-deps.mjs"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Playwright tests (local build)
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: ${{ inputs.test_command }}

      # `npx playwright test` exits 0 when every test skips, so a suite that
      # skips itself wholesale would otherwise report green having asserted
      # nothing. Runs even when the tests failed, to report what actually ran.
      - name: Tests actually ran check
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: node "$RUNNER_TEMP/foundation/scripts/check-tests-ran.mjs"
