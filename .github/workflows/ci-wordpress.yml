name: CI Guardrails (WordPress)

# Reusable guardrail workflow for WordPress plugin projects. Runs Playwright
# against a staging/preview URL instead of spinning up WordPress + a database.
#
#   jobs:
#     guardrails:
#       uses: blueworx-io/bluegroup_core_foundation/.github/workflows/ci-wordpress.yml@main
#       with:
#         preview_url: https://staging.example.com
#         plugin_slug: my-plugin
#       secrets: inherit
#
# Tests that sign in to wp-admin need WP_ADMIN_USER and WP_ADMIN_PASS. Without
# them those specs skip themselves and the run reports green having asserted
# nothing — pass them via `secrets: inherit` (or explicitly) so the gate is real.
#
on:
  workflow_call:
    inputs:
      preview_url:
        description: >-
          Staging/preview URL Playwright runs against. Not needed when
          use_local_wordpress is true. One of the two is required.
        type: string
        required: false
        default: ''
      use_local_wordpress:
        description: >-
          Provision a disposable WordPress on the runner (PHP + SQLite, no Docker)
          and test against that instead of a preview URL. Prefer this — a run that
          owns its own instance cannot silently skip against a dead staging host.
        type: boolean
        default: false
      plugin_slug:
        description: Plugin slug (used for the single-zip check). Inferred from the main plugin file if empty.
        type: string
        default: ''
      node_version:
        description: Node.js version (only used if the plugin has a package.json).
        type: string
        default: '20'
      php_version:
        description: PHP version.
        type: string
        default: '8.2'
      lint_command:
        description: Command to run the linter (skipped if no package.json).
        type: string
        default: npm run lint
      build_command:
        description: Command to build assets (skipped if no package.json).
        type: string
        default: npm run build
      test_command:
        description: >-
          Command to run Playwright tests against the preview URL. Keep the json
          reporter — the zero-tests check reads its output.
        type: string
        default: npx playwright test --reporter=list,json
      allow_zero_tests:
        description: >-
          Temporary escape hatch: downgrade the zero-tests failure to a warning
          for a project that has no working test host yet. Leave false. A project
          setting this true is not being tested — track the removal.
        type: boolean
        default: false
      wp_login_path:
        description: Path to the WordPress login screen, if the project moves it off /wp-login.php.
        type: string
        default: ''
      foundation_ref:
        description: Ref of the foundation repo to pull the shared check scripts from.
        type: string
        default: main
    secrets:
      WP_ADMIN_USER:
        description: WordPress admin username for tests that sign in. Specs requiring it skip themselves when absent.
        required: false
      WP_ADMIN_PASS:
        description: WordPress admin password for tests that sign in. Specs requiring it skip themselves when absent.
        required: false

jobs:
  guardrails:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout foundation (shared check scripts)
        uses: actions/checkout@v4
        with:
          repository: blueworx-io/bluegroup_core_foundation
          ref: ${{ inputs.foundation_ref }}
          path: .foundation

      - name: Fetch base branch
        if: github.base_ref != ''
        run: git fetch --no-tags origin "${{ github.base_ref }}" || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer, cs2pr, phpcs
          # pdo_sqlite/sqlite3 back the local WordPress harness.
          extensions: pdo_sqlite, sqlite3

      - name: Resolve the test target
        env:
          PREVIEW_URL: ${{ inputs.preview_url }}
          USE_LOCAL: ${{ inputs.use_local_wordpress }}
        run: |
          if [ "$USE_LOCAL" = "true" ]; then
            echo "TEST_BASE_URL=http://127.0.0.1:8881" >> "$GITHUB_ENV"
          elif [ -n "$PREVIEW_URL" ]; then
            echo "TEST_BASE_URL=$PREVIEW_URL" >> "$GITHUB_ENV"
            case "$PREVIEW_URL" in
              *placeholder*|*example.com*)
                echo "::warning title=Placeholder preview URL::preview_url looks like a placeholder ($PREVIEW_URL). Specs that guard against it will skip, and the zero-tests check will then fail the build. Set use_local_wordpress: true instead." ;;
            esac
          else
            echo "Neither preview_url nor use_local_wordpress was provided. Set one." >&2
            exit 1
          fi

      - name: Install Node dependencies (if package.json)
        run: |
          if [ -f package.json ]; then
            if [ -f package-lock.json ]; then npm ci; else npm install; fi
          else
            echo "No package.json — skipping Node install."
          fi

      - name: Lint (if package.json)
        run: |
          if [ -f package.json ]; then ${{ inputs.lint_command }}; else echo "No package.json — skipping lint."; fi

      - name: Build (if package.json)
        run: |
          if [ -f package.json ]; then ${{ inputs.build_command }}; else echo "No package.json — skipping build."; fi

      - name: PHP syntax check
        run: |
          set -o pipefail
          find . \( -path ./vendor -o -path ./node_modules -o -path ./.foundation -o -path ./.wp-test \) -prune \
            -o -name '*.php' -print0 | xargs -0 -r -n1 -P4 php -l

      - name: PHPCS (if a phpcs config exists)
        run: |
          if ls phpcs.xml phpcs.xml.dist .phpcs.xml >/dev/null 2>&1; then
            if [ -f composer.json ]; then composer install --no-interaction --no-progress || true; fi
            if [ -f vendor/bin/phpcs ]; then
              vendor/bin/phpcs -q --report=checkstyle | cs2pr
            else
              phpcs -q --report=checkstyle | cs2pr
            fi
          else
            echo "No phpcs config (phpcs.xml / .dist / .phpcs.xml) — skipping PHPCS."
          fi

      - name: Version bump check (plugin header)
        env:
          BASE_REF: ${{ github.base_ref }}
          VERSION_SOURCE: plugin-header
        run: node "$GITHUB_WORKSPACE/.foundation/scripts/check-version-bump.mjs"

      - name: Changelog check
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node "$GITHUB_WORKSPACE/.foundation/scripts/check-changelog.mjs"

      - name: Approved dependencies check
        run: node "$GITHUB_WORKSPACE/.foundation/scripts/check-approved-deps.mjs"

      - name: Plugin version sync (header vs package.json)
        run: node "$GITHUB_WORKSPACE/.foundation/scripts/check-plugin-version-sync.mjs"

      - name: Plugin zip check (only one <slug> zip)
        env:
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: node "$GITHUB_WORKSPACE/.foundation/scripts/check-plugin-zip.mjs"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # The secrets context is not usable in an `if:` expression, so read them
      # through env and test the values in the shell instead.
      # Only meaningful against a preview URL. The local harness ships its own
      # admin account, so warning there is noise that reads like a real problem.
      - name: Warn if admin credentials are missing
        if: ${{ ! inputs.use_local_wordpress }}
        env:
          WP_ADMIN_USER: ${{ secrets.WP_ADMIN_USER }}
          WP_ADMIN_PASS: ${{ secrets.WP_ADMIN_PASS }}
        run: |
          if [ -z "$WP_ADMIN_USER" ] || [ -z "$WP_ADMIN_PASS" ]; then
            echo "::warning title=No WordPress admin credentials::WP_ADMIN_USER / WP_ADMIN_PASS were not passed to this workflow. Specs that sign in to wp-admin will skip themselves, so this run may assert far less than it appears to. Pass them with 'secrets: inherit' in the caller."
          else
            echo "WordPress admin credentials present."
          fi

      - name: Start local WordPress
        if: inputs.use_local_wordpress
        env:
          PLUGIN_SLUG: ${{ inputs.plugin_slug }}
        run: |
          SLUG="${PLUGIN_SLUG:-$(basename "$PWD")}"
          node "$GITHUB_WORKSPACE/.foundation/scripts/wp-test-env.mjs" up \
            --plugin . --slug "$SLUG" --dir .wp-test --port 8881

      # The local harness ships its own admin account; a preview URL relies on
      # the caller's secrets. Either way the suite reads the same variables.
      - name: Playwright tests
        env:
          PLAYWRIGHT_BASE_URL: ${{ env.TEST_BASE_URL }}
          BASE_URL: ${{ env.TEST_BASE_URL }}
          WP_ADMIN_USER: ${{ inputs.use_local_wordpress && 'admin' || secrets.WP_ADMIN_USER }}
          WP_ADMIN_PASS: ${{ inputs.use_local_wordpress && 'wptest-admin-pw' || secrets.WP_ADMIN_PASS }}
          WP_LOGIN_PATH: ${{ inputs.wp_login_path }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: ${{ inputs.test_command }}

      - name: Stop local WordPress
        if: always() && inputs.use_local_wordpress
        run: |
          node "$GITHUB_WORKSPACE/.foundation/scripts/wp-test-env.mjs" down --dir .wp-test || true

      - name: Upload WordPress debug log on failure
        if: failure() && inputs.use_local_wordpress
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-debug-log
          path: |
            .wp-test/php-server.log
            .wp-test/wp/wp-content/debug.log
          if-no-files-found: ignore

      # `npx playwright test` exits 0 when every test skips, so a suite that
      # skips itself wholesale would otherwise report green having asserted
      # nothing. This is what turns the missing-credentials warning above, and a
      # placeholder preview_url, into a hard failure. Runs even when the tests
      # failed, to report what actually ran.
      - name: Tests actually ran check
        if: always()
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
          ALLOW_ZERO_TESTS: ${{ inputs.allow_zero_tests }}
        run: node "$GITHUB_WORKSPACE/.foundation/scripts/check-tests-ran.mjs"
