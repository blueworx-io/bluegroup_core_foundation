name: Foundation CI

# Self-CI for this repo: runs the check-script unit tests, syntax-checks every
# script, and runs the page editor's own browser suite against a disposable
# WordPress on each PR. This is the status check that main's branch protection
# requires. (The ci-*.yml workflows are reusable and only run in consumer repos.)
#
# ## Why the gate is a separate job
#
# `test` is the job name branch protection requires. Putting the matrix on it
# would rename its check to `test (20)`, `test (26)`… — the required check would
# then never report and every PR here would block forever. So the matrix runs as
# `checks` and `test` stays a single, unmatrixed job reporting the verdict.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Developers run current Node; pinning CI to the oldest one cannot see what
  # they hit. wp-test-env.mjs crashed on every `up` for anyone on Node 22+ while
  # this workflow stayed green, because the behaviour it relied on changed in a
  # later undici.
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the reusable workflows still default consumers to, and
        # current. Move both forward together when that default moves.
        node: ['20', '26']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax-check all scripts
        run: |
          for f in scripts/*.mjs scripts/lib/*.mjs .claude/hooks/*.mjs \
                   .claude/skills/blueworx-admin-design/editor/*.js; do
            node --check "$f"
          done

      - name: Run unit tests
        run: node --test scripts/lib/*.test.mjs .claude/hooks/*.test.mjs

  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Syntax-check the library
        run: find .claude/skills/blueworx-admin-design/editor/php -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        run: vendor/bin/phpunit

  # The page editor is a browser library, and neither job above can see whether
  # it actually saves: `checks` never opens a page, and `php` never runs
  # WordPress. This job runs the library's own spec against the disposable
  # WordPress the harness provisions, so the save model, the field controls and
  # the round trip are a guardrail rather than something checked by hand.
  #
  # Playwright arrives as the same disposable, gitignored install under
  # .wp-test/.pw that docs/wordpress-test-harness.md tells a person to make. A
  # dev dependency would be less work per run, but it would mean a package.json
  # here — and this repo is copied into every consumer, so that is a Node
  # project every plugin would then carry. One `npm install --no-save --prefix`
  # per run keeps it off the repo, and keeps CI running the same commands the
  # docs do.
  wordpress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          # pdo_sqlite/sqlite3 back the local WordPress harness.
          extensions: pdo_sqlite, sqlite3
          coverage: none

      - name: Install Playwright
        run: |
          npm install --no-save --prefix .wp-test/.pw @playwright/test
          .wp-test/.pw/node_modules/.bin/playwright install --with-deps chromium

      # Staging has to run before `up`: coming up activates the example plugin,
      # and that fatals on a library that is not staged yet. The config's
      # globalSetup stages again before the suite starts; both are cheap.
      - name: Stage the example plugin
        run: node scripts/stage-example-plugin.mjs

      - name: Start local WordPress
        run: node scripts/wp-test-env.mjs up --plugin .wp-test/example-plugin

      # NODE_PATH has to point at the very install the CLI came from — two
      # physical copies of @playwright/test and it refuses to run at all. See
      # the note at the top of playwright.config.js.
      - name: Run the page editor suite
        env:
          NODE_PATH: ${{ github.workspace }}/.wp-test/.pw/node_modules
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8881
          WP_ADMIN_USER: admin
          WP_ADMIN_PASS: wptest-admin-pw
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: |
          .wp-test/.pw/node_modules/.bin/playwright test \
            --workers=1 --reporter=list,json

      # Playwright exits 0 when every test skips, so without this a suite that
      # skipped itself wholesale would report green having asserted nothing.
      - name: Tests actually ran check
        run: node scripts/check-tests-ran.mjs

      - name: Stop local WordPress
        if: always()
        run: node scripts/wp-test-env.mjs down || true

      - name: Upload the WordPress debug log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wordpress-debug-log
          path: |
            .wp-test/php-server.log
            .wp-test/wp/wp-content/debug.log
          if-no-files-found: ignore
          retention-days: 7

  # The job branch protection requires. Keep this name.
  test:
    if: always()
    needs: [checks, php, wordpress]
    runs-on: ubuntu-latest
    steps:
      # A skipped or cancelled dependency counts as a pass to branch protection,
      # so anything that is not an explicit success has to fail here.
      - name: Check every Node version passed
        env:
          CHECKS: ${{ needs.checks.result }}
        run: |
          echo "checks: $CHECKS"
          if [ "$CHECKS" != "success" ]; then
            echo "::error title=Foundation CI failed::The 'checks' matrix did not succeed (result: $CHECKS)."
            exit 1
          fi

      - name: Check the PHP job passed
        env:
          PHP: ${{ needs.php.result }}
        run: |
          echo "php: $PHP"
          if [ "$PHP" != "success" ]; then
            echo "::error title=Foundation CI failed::The 'php' job did not succeed (result: $PHP)."
            exit 1
          fi

      - name: Check the WordPress job passed
        env:
          WORDPRESS: ${{ needs.wordpress.result }}
        run: |
          echo "wordpress: $WORDPRESS"
          if [ "$WORDPRESS" != "success" ]; then
            echo "::error title=Foundation CI failed::The 'wordpress' job did not succeed (result: $WORDPRESS)."
            exit 1
          fi
